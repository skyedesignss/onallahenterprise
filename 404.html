<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | ON-ALLAH ENTERPRISE</title>
  <meta name="description" content="The page you're looking for could not be found. Return to ON-ALLAH ENTERPRISE homepage or contact us for assistance.">
  <meta name="robots" content="noindex, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="apple-touch-icon" sizes="180x180" href="assets/on-favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/on-favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/on-favicon/favicon-16x16.png">
  <link rel="manifest" href="assets/on-favicon/site.webmanifest">

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/styles2.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="error-page" id="error-page">
  <div class="error-page__bg"></div>

  <div class="container error-page__container">

    <div class="error-visual reveal">

        <svg class="error-route" viewBox="0 0 600 280" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

            <path class="error-route__path" 
              d="M40 140 
                 C 120 140, 160 80, 220 100 
                 C 280 120, 300 180, 300 140 
                 C 300 100, 320 60, 380 80 
                 C 440 100, 480 140, 560 140" 
              stroke="var(--color-primary)" 
              stroke-width="1.75" 
              stroke-linecap="round"
              stroke-dasharray="6 8"
              fill="none"/>

        <path class="error-route__gap" 
              d="M260 140 C 280 155, 320 125, 340 140" 
              stroke="var(--color-primary)" 
              stroke-width="1.75" 
              stroke-linecap="round"
              stroke-dasharray="3 10"
              opacity="0.35"
              fill="none"/>

        <circle class="error-route__point error-route__point--origin" cx="40" cy="140" r="6" fill="var(--color-primary)"/>
        <circle class="error-route__point-ring" cx="40" cy="140" r="11" stroke="var(--color-primary)" stroke-width="1" fill="none" opacity="0.4"/>

        <circle class="error-route__point error-route__point--dest" cx="560" cy="140" r="6" fill="var(--color-primary)"/>
        <circle class="error-route__point-ring" cx="560" cy="140" r="11" stroke="var(--color-primary)" stroke-width="1" fill="none" opacity="0.4"/>

        <circle class="error-route__indicator" cx="40" cy="140" r="4.5" fill="var(--color-primary)"/>
      </svg>

      <div class="error-code" aria-hidden="true">
        <span class="error-code__digit">4</span>
        <span class="error-code__digit error-code__digit--mid">0</span>
        <span class="error-code__digit">4</span>
      </div>
    </div>

    <div class="error-content reveal reveal-delay-1">
      <span class="section-eyebrow">
        <span class="section-eyebrow__dot"></span>
        Route Not Found
      </span>

      <h1 class="error-content__title">This route couldn't be found.</h1>

      <p class="error-content__text">
        The page you're looking for may have moved, changed, or no longer exists. 
        Let's get you back on track.
      </p>

      <p class="error-content__tagline">WE ARE HERE AND WE CARE</p>

      <div class="error-content__actions">
        <a href="/" class="btn btn--primary">Back to Home</a>
        <a href="/contact" class="btn btn--secondary">Contact Us</a>
      </div>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="assets/js/main.js"></script>
</body>
</html>
